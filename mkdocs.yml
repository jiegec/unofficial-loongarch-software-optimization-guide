site_name: Unofficial LoongArch Software Optimization Guide
site_description: Unofficial software optimization guide for the LoongArch LA464 and LA664 cores
site_url: https://jia.je/unofficial-loongarch-software-optimization-guide
repo_url: https://github.com/jiegec/unofficial-loongarch-software-optimization-guide
repo_name: jiegec/unofficial-loongarch-software-optimization-guide
copyright: Copyright &copy; 2026 Jiajie Chen

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Introduction: intro.md
  - Microarchitecture:
      - Microarchitecture overview: microarchitecture/index.md
      - Instruction set architecture: microarchitecture/isa.md
      - Processor block diagram: microarchitecture/block-diagram.md
      - Cache hierarchy: microarchitecture/caches.md
      - Address translation: microarchitecture/address-translation.md
      - Optimizing branching: microarchitecture/branching.md
      - Instruction fetch and decode: microarchitecture/front-end.md
      - Integer execution: microarchitecture/integer.md
      - Floating-point execution: microarchitecture/fp.md
      - Vector execution (LSX and LASX): microarchitecture/vector.md
      - Binary translation execution (LBT): microarchitecture/lbt.md
      - Load-store unit: microarchitecture/load-store.md
      - Data prefetching: microarchitecture/prefetch.md
      - Simultaneous multithreading: microarchitecture/smt.md
      - Core-to-core latency: microarchitecture/core-to-core.md
      - Atomics and memory ordering: microarchitecture/atomics.md
  - Instruction latency and throughput: latency-throughput.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
